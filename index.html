let mode=params.get('mode') || params.get('screen') || 'player';
let room=(params.get('room') || localStorage.getItem('quant_room') || 'FM').toUpperCase().replace(/[^A-Z0-9А-Я]/g,'').slice(0,12);
localStorage.setItem('quant_room',room);

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const toast=(msg,ms=2600)=>{toastBox.innerHTML=msg;toastBox.classList.remove('hidden');setTimeout(()=>toastBox.classList.add('hidden'),ms)};
const roomPath=()=>`quantHackRooms/${room}`;
const localKey=()=>`quantHack_${room}`;
const rnd=n=>Math.floor(Math.random()*n);
const defaultState=()=>({room,createdAt:Date.now(),players:{},events:{},online:true});
const now=()=>Date.now();

function hashCode(str){let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0;}
function seededShuffle(arr, seedStr){let a=[...arr], seed=hashCode(seedStr)||1; const rand=()=>{seed=(seed*1664525+1013904223)>>>0; return seed/4294967296;}; for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}

async function readState(){ if(FIREBASE_READY){const s=await get(ref(db,roomPath())); return s.val();} return JSON.parse(localStorage.getItem(localKey())||'null'); }
async function writeState(s){ if(FIREBASE_READY) return set(ref(db,roomPath()),s); localStorage.setItem(localKey(),JSON.stringify(s)); window.dispatchEvent(new Event('quant-local-change')); }
async function setPath(path,val){ if(FIREBASE_READY) return set(ref(db,`${roomPath()}/${path}`),val); const s=await readState()||defaultState(); let cur=s; const parts=path.split('/').filter(Boolean); while(parts.length>1){const p=parts.shift();cur[p]=cur[p]||{};cur=cur[p];} cur[parts[0]]=val; await writeState(s); }
async function patchPath(path,obj){ if(FIREBASE_READY) return update(ref(db,`${roomPath()}/${path}`),obj); const s=await readState()||defaultState(); let cur=s; const parts=path.split('/').filter(Boolean); while(parts.length>1){const p=parts.shift();cur[p]=cur[p]||{};cur=cur[p];} cur[parts[0]]=Object.assign(cur[parts[0]]||{},obj); await writeState(s); }
async function addEvent(text,kind='good'){ const ev={text,kind,ts:now()}; if(FIREBASE_READY) return push(ref(db,`${roomPath()}/events`),ev); const s=await readState()||defaultState(); s.events=s.events||{}; s.events['e'+now()+Math.random().toString(16).slice(2)]=ev; await writeState(s); }
function listen(){ if(unsub) unsub(); if(FIREBASE_READY){unsub=onValue(ref(db,roomPath()),snap=>{state=snap.val(); if(!state) initRoom(); else render();});} else {const load=()=>{state=JSON.parse(localStorage.getItem(localKey())||'null'); if(!state) initRoom(); else render();}; window.addEventListener('quant-local-change',load); setInterval(load,900); load();} }
async function initRoom(){ const s=defaultState(); await writeState(s); state=s; render(); }
function players(){return Object.entries(state?.players||{}).map(([id,p])=>({id,...p}));}
function activePlayers(){return players().filter(p=>now()-(p.lastSeen||0)<1000*60*20);}
function sortedPlayers(){return players().sort((a,b)=>(b.credits||0)-(a.credits||0));}
function me(){return state?.players?.[playerId]||null;}
function myQuestion(){const p=me(); return QUESTIONS[Math.min(p?.qIndex||0,QUESTIONS.length-1)];}
function isFinal(p){return (p?.qIndex||0)>=QUESTIONS.length-5;}
function playerUrl(){const u=new URL(location.href);u.search=`?mode=player&room=${encodeURIComponent(room)}`;return u.href;}
function projectorUrl(){const u=new URL(location.href);u.search=`?mode=projector&room=${encodeURIComponent(room)}`;return u.href;}
function baseWin(q,p){let gain=q.boss?1000:250; if(isFinal(p)) gain*=2; if(p.doubleNext){gain*=2;} return gain;}
function cleanPatch(patch){Object.keys(patch).forEach(k=>patch[k]===undefined && delete patch[k]); return patch;}
function currentPortfolioValue(p){return p?.credits||0;}

function finishedPlayers(){return players().filter(p=>p.name && (p.qIndex||0)>=QUESTIONS.length);}
function gameFinished(){const ps=players().filter(p=>p.name); return ps.length>0 && ps.every(p=>(p.qIndex||0)>=QUESTIONS.length);}
function winner(){return sortedPlayers()[0]||null;}
function winnerHtml(){
  if(!gameFinished()) return '';
  const w=winner(); if(!w) return '';
  return `<div class="winner-banner"><div class="winner-title">🏆 ПАЗАРЪТ ЗАТВОРИ</div><div class="muted">Победител в RUSE QUANT EXCHANGE</div><div class="winner-name">${esc(w.name)}</div><div class="scorebig">${currentPortfolioValue(w)}</div><p class="muted">КвантКредити • Финансовата математика има нов властелин на портфейла.</p></div>`;
}
function updateMusicButton(){const b=document.getElementById('musicToggle'); if(b) b.textContent=musicOn?'⏸️ Спри музика':'🎧 Музика';}
function playTone(freq,dur=0.12,type='sawtooth',vol=0.035){
  if(!audioCtx || !musicOn) return;
  const t=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,t);
  gain.gain.setValueAtTime(0.0001,t);
  gain.gain.exponentialRampToValueAtTime(vol,t+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t); osc.stop(t+dur+0.03);
}
async function startMusic(){
  if(musicOn || gameFinished()) return;
  audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  await audioCtx.resume();
  musicOn=true; updateMusicButton();
  const bass=[82.41,98,110,123.47,110,98,92.5,82.41];
  const lead=[329.63,392,493.88,392,369.99,329.63,293.66,246.94];
  let step=0;
  musicTimer=setInterval(()=>{
    if(gameFinished()){stopMusic(); return;}
    playTone(bass[step%bass.length],0.11,'square',0.018);
    if(step%2===0) playTone(lead[step%lead.length],0.08,'sawtooth',0.012);
    if(step%4===3) playTone(659.25,0.035,'triangle',0.008);
    step++;
  },150);
  toast('🎧 Хакерската музика е включена. Ако стане прекалено Wall Street, натисни бутона долу вдясно.');
}
function stopMusic(){
  if(musicTimer) clearInterval(musicTimer);
  musicTimer=null; musicOn=false; updateMusicButton();
}
window.toggleMusic=async()=>{ if(musicOn) stopMusic(); else await startMusic(); };


function leaderboardHtml(){const list=sortedPlayers(); if(!list.length)return '<p class="muted">Още няма играчи.</p>'; return list.map((p,i)=>`<div class="leader"><div class="rank">${i+1}</div><div><div class="name">${esc(p.name)}</div><div class="muted">Q${Math.min((p.qIndex||0)+1,QUESTIONS.length)}/${QUESTIONS.length} • 🔥 ${p.streak||0} ${p.shieldRounds>0?'• 🛡️ '+p.shieldRounds:''} ${p.masterHack?'• 💀 квантов удар':''}</div></div><div class="score">${currentPortfolioValue(p)}</div></div>`).join('');}
function eventsHtml(limit=8){const ev=Object.values(state?.events||{}).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,limit); if(!ev.length)return '<p class="muted">Пазарът още е спокоен. Подозрително спокоен.</p>'; return ev.map(e=>`<div class="event ${e.kind||''}">${esc(e.text)}<div class="muted" style="font-size:12px">${new Date(e.ts).toLocaleTimeString('bg-BG',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('');}

function render(){ const finished=gameFinished(); if(finished) stopMusic(); if(finished && !lastFinishedState){ lastFinishedState=true; const w=winner(); if(w) addEvent(`🏆 Пазарът затвори. Победител: ${w.name} с ${currentPortfolioValue(w)} КвантКредита.`, 'good'); } if(!finished) lastFinishedState=false; if(mode==='projector') return renderProjector(); return renderPlayer(); }

  app.innerHTML=`<div class="grid">

      </div><br>
      ${done?`<div class="glass center"><h2>🏁 Портфейлът е затворен!</h2><p>${gameFinished()?`Играта приключи. Победител: <b>${esc(winner()?.name||'')}</b>.`:`Ти завърши всички въпроси. Изчакваме останалите фондове да затворят позициите си.`}</p><button class="btn3" onclick="window.restartMe()">🔁 Играй отново</button></div>`:
      skipped?`<div class="glass center"><h2>⚠️ Margin Call</h2><p>Този въпрос е блокиран. Следващият ще се отвори сам.</p></div>`:
      `<div class="glass"><span class="pill">${esc(q.t)} ${q.boss?'• БОС ВЪПРОС':''} ${isFinal(p)?'• ⚔️ БИТКА ЗА FM-RU INDEX ×2':''}</span><h2>${esc(q.q)}</h2></div><br>${options.map(o=>`<button class="answer" onclick="window.answer(${o.i},this)">${esc(o.text)}</button>`).join('')}`}
    </section>
    <section class="card col-4"><h2>Стойност на портфейла</h2><div class="scorebig">${p.credits||0}</div><p class="muted">КвантКредити</p>${p.masterHack?'<button class="btn2" onclick="window.openMasterHack()">💀 КВАНТОВ УДАР</button><br><br>':''}<button class="ghost small" onclick="window.showLinks()">🔗 Линкове за стаята</button></section>
    <section class="card col-12"><h2>🏆 Класиране на фондовете</h2>${leaderboardHtml()}</section>
  </div>`;
  if(skipped && now()-lastAutoAdvance>2000){ lastAutoAdvance=now(); setTimeout(()=>advanceQuestion(true),1500); }
}

async function heartbeat(){const p=me(); if(!p || now()-(p.lastSeen||0)<15000)return; await patchPath(`players/${playerId}`,{lastSeen:now()});}

window.registerPlayer=async()=>{
  const name=($('#name')?.value||'').trim().slice(0,24);
  if(!name) return toast('Напиши име или квантов псевдоним.');
  playerName=name; localStorage.setItem('quant_player_name',name);
  const p={name,credits:1000,stocks:0,investors:0,riskCapital:0,streak:0,qIndex:0,shieldRounds:0,masterHack:false,doubleNext:false,risky:false,skipThis:false,lastSeen:now(),joinedAt:now()};
  await setPath(`players/${playerId}`,p);
  await addEvent(`${name} отвори фонд на RUSE QUANT EXCHANGE.`, 'good');
  startMusic().catch(()=>toast('Браузърът блокира автоматичния звук. Натисни 🎧 Музика долу вдясно.'));
};

window.answer=async(choice,btn)=>{
  const p=me(); if(!p)return; const q=myQuestion();
  document.querySelectorAll('.answer').forEach(b=>b.disabled=true);
  const correct=choice===q.c;
  btn.classList.add(correct?'correct':'wrong');
  let patch={lastSeen:now(),answeredAt:now(),skipThis:false};
  if(correct){
    let gain=baseWin(q,p);
    let coupon=(p.coupons||0)>0 && ((p.qIndex||0)+1)%3===0 ? (p.coupons||0)*300 : 0;
    gain+=coupon;
    patch.credits=(p.credits||0)+gain;
    patch.streak=(p.streak||0)+1;
    patch.doubleNext=false;
    patch.risky=false;
    if((patch.streak||0)>=3){patch.masterHack=true;}
    if(p.shieldRounds>0) patch.shieldRounds=Math.max(0,(p.shieldRounds||0)-1);
    await patchPath(`players/${playerId}`,cleanPatch(patch));
    await addEvent(`${p.name} отговори вярно и реализира доходност +${gain}.`, 'good');
    setTimeout(()=>drawCard(),650);
  }else{
    let loss=q.boss?500:150;
    if(p.risky) loss+=800;
    if(Math.random()<0.35){ loss+=200; await addEvent(`Грешна пазарна прогноза при ${p.name}: -200 допълнително.`, 'bad'); }
    patch.credits=Math.max(0,(p.credits||0)-loss);
    patch.streak=0; patch.risky=false; patch.doubleNext=false;
    if(p.shieldRounds>0) patch.shieldRounds=Math.max(0,(p.shieldRounds||0)-1);
    await patchPath(`players/${playerId}`,cleanPatch(patch));
    await addEvent(`${p.name} сбърка и получи пазарна загуба -${loss}.`, 'bad');
    setTimeout(()=>advanceQuestion(false),1700);
  }
};

async function drawCard(){ const card=CARDS[rnd(CARDS.length)]; showCard(card); }
function showCard(card){
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="cardModal"><div class="modal-box center"><h2>${esc(card.name)}</h2><p>${esc(card.text)}</p>${card.target?'<button class="btn2" onclick="window.chooseTarget(\''+card.id+'\')">Избери кого да атакуваш</button>':'<button onclick="window.applyCard(\''+card.id+'\')">Приеми картата</button>'}</div></div>`);
}
window.applyCard=async(cardId)=>{
  document.getElementById('cardModal')?.remove();
  const p=me(); if(!p)return;
  if(cardId==='bull'){await patchPath(`players/${playerId}`,{credits:(p.credits||0)+500,stocks:(p.stocks||0)+1}); await addEvent(`${p.name} изтегли „Бичи пазар“: +500.`, 'good');}
  if(cardId==='insurance'){await patchPath(`players/${playerId}`,{shieldRounds:Math.max(p.shieldRounds||0,1)}); await addEvent(`${p.name} купи „Застрахователна полица“.`, 'good');}
  if(cardId==='aaa'){await patchPath(`players/${playerId}`,{shieldRounds:Math.max(p.shieldRounds||0,2)}); await addEvent(`${p.name} получи „Кредитен рейтинг AAA“ за 2 рунда.`, 'good');}
  if(cardId==='coupon'){await patchPath(`players/${playerId}`,{coupons:(p.coupons||0)+1}); await addEvent(`${p.name} активира „Облигационен купон“.`, 'good');}
  if(cardId==='aitrader'){await patchPath(`players/${playerId}`,{doubleNext:true,riskCapital:(p.riskCapital||0)+1}); await addEvent(`${p.name} пусна „AI трейдър“: следваща печалба ×2.`, 'good');}
  if(cardId==='centralbank'){await centralBank(p);}
  if(cardId==='crisis'){await globalLose(150,`${p.name} отключи „Финансова криза“: всички губят 150.`);}
  if(cardId==='lln'){await lawLargeNumbers(p);}
  if(cardId==='regression'){await regressionHack(p);}
  if(cardId==='montecarlo'){await monteCarlo(p);}
  if(cardId==='blackswan'){await blackSwan(p);}
  setTimeout(()=>advanceQuestion(false),900);
};

async function centralBank(p){
  const s=await readState(); const ps=s.players||{};
  for(const [id,x] of Object.entries(ps)){x.credits=(x.credits||0)+(id===playerId?500:200);}
  await writeState(s); await addEvent(`${p.name} активира „Централна банка“: ликвидност за всички, повече за него.`, 'good');
}
async function lawLargeNumbers(p){
  const list=sortedPlayers(); const pos=list.findIndex(x=>x.id===playerId); const bonus=pos>=Math.floor(list.length/2)?700:200;
  await patchPath(`players/${playerId}`,{credits:(p.credits||0)+bonus}); await addEvent(`${p.name} получи „Закон за големите числа“: +${bonus}.`, 'good');
}
async function regressionHack(p){
  const s=await readState(); const ps=s.players||{}; const targets=Object.entries(ps).filter(([id])=>id!==playerId).sort((a,b)=>(b[1].credits||0)-(a[1].credits||0));
  if(!targets.length){await addEvent(`${p.name} изтегли „Регресионен модел“, но няма кого да моделира.`, 'good'); return;}
  const [tid,v]=targets[0];
  if((v.shieldRounds||0)>0){v.shieldRounds=Math.max(0,(v.shieldRounds||0)-1); await writeState(s); await addEvent(`${p.name} насочи регресионен модел към ${v.name}, но защитата го спря.`, 'bad'); return;}
  const take=Math.floor((v.credits||0)*0.15); v.credits=(v.credits||0)-take; ps[playerId].credits=(ps[playerId].credits||0)+take;
  await writeState(s); await addEvent(`${p.name} моделира най-богатия фонд и взе ${take} от ${v.name}.`, 'bad');
}
async function monteCarlo(p){
  const outcomes=[800,400,0,-300]; const val=outcomes[rnd(outcomes.length)];
  await patchPath(`players/${playerId}`,{credits:Math.max(0,(p.credits||0)+val),riskCapital:(p.riskCapital||0)+1}); await addEvent(`${p.name} пусна „Монте Карло симулация“: ${val>=0?'+':''}${val}.`, val>=0?'good':'bad');
}
async function blackSwan(p){
  const s=await readState(); const list=Object.entries(s.players||{}).sort((a,b)=>(b[1].credits||0)-(a[1].credits||0));
  if(list.length<2){await addEvent(`${p.name} видя Black Swan, но пазарът е твърде малък.`, 'bad'); return;}
  const first=list[0], last=list[list.length-1]; const temp=first[1].credits||0; first[1].credits=last[1].credits||0; last[1].credits=temp;
  await writeState(s); await addEvent(`🔥 Black Swan: ${first[1].name} и ${last[1].name} размениха стойностите на портфейлите си.`, 'bad');
}
async function globalLose(amount,msg){ const s=await readState(); for(const p of Object.values(s.players||{})){p.credits=Math.max(0,(p.credits||0)-amount);} await writeState(s); await addEvent(msg,'bad'); }

window.chooseTarget=(cardId)=>{
  document.getElementById('cardModal')?.remove();
  const list=activePlayers().filter(p=>p.id!==playerId);
  if(!list.length){toast('Няма друг активен фонд за атака. Пазарна самота.'); setTimeout(()=>advanceQuestion(false),900); return;}
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="targetModal"><div class="modal-box"><h2>Избери цел</h2><p class="muted">Финансовата атака е образователна. Почти.</p>${list.map(p=>`<button class="wide btn2" onclick="window.applyTargetCard('${cardId}','${p.id}')">${esc(p.name)} — 💰 ${p.credits||0} ${p.shieldRounds>0?'🛡️':''}</button><br><br>`).join('')}<button class="ghost" onclick="document.getElementById('targetModal').remove(); window.advanceQuestion(false)">Пропусни</button></div></div>`);
};
window.applyTargetCard=async(cardId,targetId)=>{
  document.getElementById('targetModal')?.remove();
  const s=await readState(); const attacker=s.players?.[playerId], victim=s.players?.[targetId]; if(!attacker||!victim)return;
  if((victim.shieldRounds||0)>0){ victim.shieldRounds=Math.max(0,(victim.shieldRounds||0)-1); await writeState(s); await addEvent(`${attacker.name} атакува ${victim.name}, но застрахователният щит го спря.`, 'bad'); setTimeout(()=>advanceQuestion(false),1000); return; }
  if(cardId==='bear'){
    victim.credits=Math.max(0,(victim.credits||0)-300);
    await writeState(s); await addEvent(`${attacker.name} пусна „Мечи пазар“ срещу ${victim.name}: -300.`, 'bad');
  }
  if(cardId==='arbitrage'){
    const take=Math.floor((victim.credits||0)*0.25); victim.credits=(victim.credits||0)-take; attacker.credits=(attacker.credits||0)+take;
    await writeState(s); await addEvent(`${attacker.name} направи арбитраж и взе ${take} от ${victim.name}.`, 'bad');
  }
  if(cardId==='margin'){
    victim.skipThis=true; await writeState(s); await addEvent(`${attacker.name} изпрати Margin Call към ${victim.name}. Следващият въпрос е блокиран.`, 'bad');
  }
  if(cardId==='pvalue'){
    if((victim.credits||0)>(attacker.credits||0)){victim.credits=Math.max(0,(victim.credits||0)-200); attacker.credits=(attacker.credits||0)+200; await writeState(s); await addEvent(`${attacker.name} хвана ${victim.name} в p-value капан: +200 за атакуващия.`, 'bad');}
    else {attacker.credits=Math.max(0,(attacker.credits||0)-100); await writeState(s); await addEvent(`${attacker.name} обърка p-value капана и загуби 100.`, 'bad');}
  }
  setTimeout(()=>advanceQuestion(false),1000);
};

window.openMasterHack=()=>{
  const list=activePlayers().filter(p=>p.id!==playerId);
  if(!list.length)return toast('Няма кого да удариш с КВАНТОВ УДАР.');
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="masterModal"><div class="modal-box"><h2>💀 КВАНТОВ УДАР</h2><p class="muted">Кради 35% от КвантКредитите. Ако жертвата има защита, тя пада.</p>${list.map(p=>`<button class="wide danger" onclick="window.applyMasterHack('${p.id}')">${esc(p.name)} — 💰 ${p.credits||0} ${p.shieldRounds>0?'🛡️':''}</button><br><br>`).join('')}<button class="ghost" onclick="document.getElementById('masterModal').remove()">Отказ</button></div></div>`);
};
window.applyMasterHack=async(targetId)=>{
  document.getElementById('masterModal')?.remove();
  const s=await readState(); const a=s.players?.[playerId], v=s.players?.[targetId]; if(!a||!v)return;
  a.masterHack=false;
  if((v.shieldRounds||0)>0){v.shieldRounds=Math.max(0,(v.shieldRounds||0)-1); await writeState(s); await addEvent(`${a.name} пусна КВАНТОВ УДАР срещу ${v.name}, но удари защитна стена.`, 'bad'); return;}
  const take=Math.floor((v.credits||0)*0.35); v.credits=(v.credits||0)-take; a.credits=(a.credits||0)+take;
  await writeState(s); await addEvent(`💀 КВАНТОВ УДАР: ${a.name} открадна ${take} от ${v.name}.`, 'bad');
};

async function advanceQuestion(wasSkip){
  const p=me(); if(!p)return;
  const next=Math.min((p.qIndex||0)+1,QUESTIONS.length);
  await patchPath(`players/${playerId}`,{qIndex:next,answeredAt:0,skipThis:false,lastSeen:now()});
}
window.advanceQuestion=advanceQuestion;
window.restartMe=async()=>{const p=me(); if(!p)return; await patchPath(`players/${playerId}`,{credits:1000,stocks:0,investors:0,riskCapital:0,coupons:0,streak:0,qIndex:0,shieldRounds:0,masterHack:false,doubleNext:false,risky:false,skipThis:false,answeredAt:0}); await addEvent(`${p.name} рестартира фонда си.`, 'good');};
window.changeRoom=()=>{const r=prompt('Код на стаята:',room); if(!r)return; room=r.toUpperCase().replace(/[^A-Z0-9А-Я]/g,'').slice(0,12)||'FM'; localStorage.setItem('quant_room',room); location.search=`?mode=player&room=${encodeURIComponent(room)}`;};
window.showLinks=()=>{document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="links"><div class="modal-box"><h2>Линкове за стаята ${esc(room)}</h2><p>Играчи:</p><div class="linkbox">${esc(playerUrl())}</div><p>Проектор:</p><div class="linkbox">${esc(projectorUrl())}</div><br><button onclick="document.getElementById('links').remove()">OK</button></div></div>`)};

listen();
</script>
